services:
  db:
    image: postgres:16-alpine
    container_name: housing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-housing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-housing}
      POSTGRES_DB: ${POSTGRES_DB:-housing}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-housing} -d ${POSTGRES_DB:-housing}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
